<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden pb-32">
<!-- Top Navigation Placeholder (Hidden for this specific flow) -->
<!-- Main Content Area -->
<main class="flex-grow flex flex-col px-container-margin pt-stack-xl relative">
<!-- Header Section -->
<header class="mb-stack-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight mb-stack-sm">

            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">

            </p>
</header>
<!-- Transaction Details Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(2,36,72,0.06)] flex flex-col gap-stack-lg mb-stack-xl relative z-10">
<!-- Amount Input (Prominent) -->
<div class="flex flex-col items-center justify-center py-stack-sm border-b border-surface-variant">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Amount</span>
<div class="flex items-center">
<span class="font-currency-tabular text-currency-tabular text-on-surface mr-1">$</span>
<input aria-label="Transaction Amount" class="bg-transparent border-none text-center font-display-lg-mobile text-display-lg-mobile text-primary focus:ring-0 p-0 w-32" inputmode="decimal" type="number" value="1500.00">
</div>
</div>
<!-- Detail Fields Grid -->
<div class="grid grid-cols-1 gap-stack-md">
<!-- Category -->
<div class="flex items-center justify-between p-3 bg-primary-light rounded-lg">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Category</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Housing</span>
</div>
</div>
<button aria-label="Edit Category" class="w-8 h-8 rounded-full hover:bg-surface-variant/20 flex items-center justify-center transition-colors text-primary">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>
<!-- Account -->
<div class="flex items-center justify-between p-3 bg-primary-light rounded-lg relative overflow-hidden">
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-secondary-container"></div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">From Account</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Main Checking</span>
</div>
</div>
<button aria-label="Edit Account" class="w-8 h-8 rounded-full hover:bg-surface-variant/20 flex items-center justify-center transition-colors text-primary">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Date</span>
