<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-container-margin py-stack-md">
<button class="text-on-surface-variant flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Change Password</h1>
<div class="w-10"></div> <!-- Placeholder to balance flex -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin py-stack-lg max-w-md mx-auto w-full">
<p class="font-body-md text-on-surface-variant mb-stack-xl">
            Choose a strong password to keep your financial data secure.
        </p>
<form class="space-y-stack-lg">
<!-- Current Password -->
<div>
<label class="block font-label-md text-on-surface mb-stack-sm" for="current-password">Current Password</label>
<div class="relative">
<input class="w-full bg-primary-light rounded-xl border-none focus:ring-2 focus:ring-primary px-4 py-3 font-body-md text-on-surface pr-10" id="current-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- New Password -->
<div>
<label class="block font-label-md text-on-surface mb-stack-sm" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-primary-light rounded-xl border-none focus:ring-2 focus:ring-primary px-4 py-3 font-body-md text-on-surface pr-10" id="new-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-stack-sm flex items-center space-x-2">
<div class="flex-1 h-1 rounded-full bg-surface-variant overflow-hidden">
<div class="h-full bg-secondary w-1/3 transition-all duration-300"></div>
</div>
<span class="font-label-sm text-on-surface-variant">Weak</span>
</div>
</div>
<!-- Confirm New Password -->
<div>
<label class="block font-label-md text-on-surface mb-stack-sm" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-primary-light rounded-xl border-none focus:ring-2 focus:ring-primary px-4 py-3 font-body-md text-on-surface pr-10" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-stack-lg">
<button class="w-full bg-primary text-white font-label-md py-4 rounded-xl shadow-[0_4px_12px_rgba(2,36,72,0.12)] active:scale-95 transition-transform duration-200" type="submit">
                    Update Password
                </button>
</div>
</form>
