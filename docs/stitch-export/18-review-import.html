<style>
        /* Custom checkbox styling for a softer, tactile feel */
        .kontrol-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 24px;
            height: 24px;
            border: 2px solid theme('colors.outline-variant');
            border-radius: 8px;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .kontrol-checkbox::before {
            content: "";
            width: 14px;
            height: 14px;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            transform-origin: bottom left;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
        }

        .kontrol-checkbox:checked {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }

        .kontrol-checkbox:checked::before {
            transform: scale(1);
        }

        .shadow-ambient {
            box-shadow: 0px 4px 20px rgba(2, 36, 72, 0.06);
        }
        
        .shadow-elevated {
            box-shadow: 0px 4px 12px rgba(2, 36, 72, 0.12);
        }
    </style>
