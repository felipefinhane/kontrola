<style>
        .thumb-zone-padding { padding-bottom: 120px; }
        .currency-input::placeholder { color: theme('colors.outline'); }
        
        /* Smooth transitions for toggle */
        .type-toggle-bg { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .is-debit .type-toggle-bg { transform: translateX(100%); }
        .is-debit .debit-text { color: theme('colors.on-primary'); }
        .is-debit .credit-text { color: theme('colors.on-surface-variant'); }
        
        .is-credit .type-toggle-bg { transform: translateX(0); background-color: theme('colors.secondary'); }
        .is-credit .credit-text { color: theme('colors.on-primary'); }
        .is-credit .debit-text { color: theme('colors.on-surface-variant'); }
        .is-debit .type-toggle-bg { background-color: theme('colors.semantic-debit'); }

        .currency-display {
            transition: color 0.3s ease;
        }
        .is-credit .currency-display { color: theme('colors.secondary'); }
        .is-debit .currency-display { color: theme('colors.semantic-debit'); }
    </style>

<body class="bg-background text-on-background min-h-screen font-body-md antialiased is-debit" id="app-body">
<!-- Top App Bar - Simplified for transactional view -->
<header class="w-full top-0 sticky bg-background z-40 px-container-margin py-stack-md flex justify-between items-center flat no shadows">
<button aria-label="Cancel" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary text-center absolute left-1/2 -translate-x-1/2">Transaction</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="px-container-margin pt-stack-sm pb-32 flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Toggle: Credit / Debit -->
<div class="relative bg-surface-container p-1 rounded-xl flex items-center justify-between mx-auto w-full max-w-[240px]">
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] rounded-lg type-toggle-bg shadow-sm"></div>
<button class="relative z-10 w-1/2 py-2 text-center font-label-md text-label-md credit-text rounded-lg transition-colors" id="btn-credit" onclick="setTransactionType('credit')">Credit</button>
<button class="relative z-10 w-1/2 py-2 text-center font-label-md text-label-md debit-text rounded-lg transition-colors" id="btn-debit" onclick="setTransactionType('debit')">Debit</button>
</div>
<!-- Amount Input -->
<div class="flex flex-col items-center justify-center mt-stack-md">
<div class="text-center w-full relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-display-lg-mobile text-display-lg-mobile text-outline opacity-50 currency-display transition-colors" id="currency-symbol">$</span>
<input class="currency-input w-full text-center bg-transparent border-none focus:ring-0 font-display-lg-mobile text-display-lg-mobile currency-display p-0" id="amount-input" inputmode="decimal" placeholder="0.00" type="text"/>
<div class="h-0.5 w-3/4 mx-auto mt-2 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Details Form -->
<div class="flex flex-col gap-stack-md mt-stack-md">
<!-- Description -->
<div class="bg-primary-light rounded-xl p-3 flex items-center gap-3">
<span class="material-symbols-outlined text-primary opacity-60">edit</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-primary p-0 placeholder-primary/50" placeholder="Description" type="text"/>
</div>
<!-- Account Picker -->
<div class="bg-primary-light rounded-xl p-3 flex items-center justify-between cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-sm">account_balance</span>
</div>
<div>
<div class="font-label-sm text-label-sm text-primary opacity-60 uppercase tracking-wider">Account</div>
<div class="font-body-md text-body-md text-primary font-semibold">Main Checking</div>
</div>
</div>
<span class="material-symbols-outlined text-primary">expand_more</span>
</div>
<!-- Date -->
<div class="bg-primary-light rounded-xl p-3 flex items-center justify-between cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary opacity-60">calendar_today</span>
<span class="font-body-md text-body-md text-primary">Today</span>
</div>
</div>
<!-- Category Grid -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-stack-sm px-1">Category</h3>
<div class="grid grid-cols-4 gap-4">
<!-- Cat 1 (Active) -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-high border-2 border-semantic-debit flex items-center justify-center text-semantic-debit transition-colors is-debit-accent is-credit-accent">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center">Food</span>
</button>
<!-- Cat 2 -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">local_taxi</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Transport</span>
</button>
<!-- Cat 3 -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Shopping</span>
</button>
<!-- Cat 4 -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined">home</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Housing</span>
</button>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full px-container-margin pb-stack-lg pt-stack-md bg-gradient-to-t from-background via-background to-transparent z-50">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-sm text-headline-sm shadow-lg active:scale-[0.98] transition-transform duration-200">
            Save Transaction
        </button>
</div>
<script>
        function setTransactionType(type) {
            const body = document.getElementById('app-body');
            if (type === 'credit') {
                body.classList.remove('is-debit');
                body.classList.add('is-credit');
                document.querySelectorAll('.is-debit-accent').forEach(el => {
                    el.classList.remove('border-semantic-debit', 'text-semantic-debit');
                    el.classList.add('border-secondary', 'text-secondary');
                });
            } else {
                body.classList.remove('is-credit');
                body.classList.add('is-debit');
                document.querySelectorAll('.is-credit-accent').forEach(el => {
                    el.classList.remove('border-secondary', 'text-secondary');
                    el.classList.add('border-semantic-debit', 'text-semantic-debit');
                });
            }
        }
        
        // Basic amount formatting logic for demo
        const input = document.getElementById('amount-input');
        input.addEventListener('input', function (e) {
            let value = e.target.value.replace(/[^0-9.]/g, '');
            // simple validation to keep one decimal point
            const parts = value.split('.');
            if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');
            e.target.value = value;
        });
    </script>
</body></html>
