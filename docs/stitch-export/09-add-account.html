<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pb-24">
<!-- Top App Bar (Task-focused, suppressing global nav) -->
<header class="w-full top-0 sticky bg-background z-40 px-container-margin py-stack-md flex justify-between items-center flat no shadows">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low active:scale-95 duration-200 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Add Account</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-grow px-container-margin pt-stack-sm pb-stack-xl flex flex-col gap-stack-lg max-w-lg mx-auto w-full">
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-sm">
            Let's set up a new account to keep track of your finances calmly.
        </p>
<!-- Balance Input (Hero section) -->
<section class="flex flex-col items-center justify-center bg-surface-container-lowest rounded-[24px] p-stack-lg shadow-ambient">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Opening Balance</label>
<div class="flex items-baseline gap-2 relative group">
<span class="font-headline-sm text-headline-sm text-on-surface-variant opacity-70">R$</span>
<input class="font-display-lg-mobile text-display-lg-mobile text-primary bg-transparent border-none focus:ring-0 text-center w-full max-w-[200px] p-0 placeholder:text-surface-variant outline-none" id="balance-input" inputmode="decimal" placeholder="0.00" type="text" value=""/>
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-primary scale-x-0 group-focus-within:scale-x-100 transition-transform duration-300 origin-center rounded-full"></div>
</div>
<div class="mt-stack-md w-full max-w-[120px]">
<div class="relative">
<select class="w-full appearance-none bg-primary-light text-primary font-label-md text-label-md rounded-xl py-2 pl-4 pr-8 border-none focus:ring-2 focus:ring-primary/20 outline-none text-center cursor-pointer">
<option selected="" value="BRL">BRL - R$</option>
<option value="USD">USD - $</option>
<option value="EUR">EUR - €</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-primary pointer-events-none text-sm">expand_more</span>
</div>
</div>
</section>
<div class="space-y-stack-md">
<!-- Account Nickname -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary ml-1" for="account-name">Account Nickname</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/60">edit</span>
<input class="w-full bg-primary-light border-none rounded-xl py-4 pl-12 pr-4 font-body-md text-body-md text-primary placeholder:text-primary/40 focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="account-name" placeholder="e.g. Main Checking, Secret Stash" type="text"/>
</div>
</div>
<!-- Bank Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary ml-1">Institution</label>
<!-- Quick Picks -->
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 pt-1 -mx-container-margin px-container-margin snap-x">
<button class="snap-start shrink-0 flex flex-col items-center justify-center w-20 h-24 bg-surface-container-lowest rounded-2xl shadow-ambient border-2 border-transparent hover:border-primary-light active:scale-95 transition-all focus:border-primary/30 group">
<div class="w-10 h-10 rounded-full bg-[#8A05BE]/10 flex items-center justify-center mb-2 group-focus:ring-2 ring-offset-2 ring-[#8A05BE]/50">
<span class="material-symbols-outlined text-[#8A05BE]">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Nubank</span>
</button>
<button class="snap-start shrink-0 flex flex-col items-center justify-center w-20 h-24 bg-surface-container-lowest rounded-2xl shadow-ambient border-2 border-transparent hover:border-primary-light active:scale-95 transition-all focus:border-primary/30 group">
<div class="w-10 h-10 rounded-full bg-[#EC7000]/10 flex items-center justify-center mb-2 group-focus:ring-2 ring-offset-2 ring-[#EC7000]/50">
<span class="material-symbols-outlined text-[#EC7000]">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Itaú</span>
</button>
<button class="snap-start shrink-0 flex flex-col items-center justify-center w-20 h-24 bg-surface-container-lowest rounded-2xl shadow-ambient border-2 border-transparent hover:border-primary-light active:scale-95 transition-all focus:border-primary/30 group">
<div class="w-10 h-10 rounded-full bg-[#CC092F]/10 flex items-center justify-center mb-2 group-focus:ring-2 ring-offset-2 ring-[#CC092F]/50">
<span class="material-symbols-outlined text-[#CC092F]">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Bradesco</span>
</button>
<button class="snap-start shrink-0 flex flex-col items-center justify-center w-20 h-24 bg-surface-container-lowest rounded-2xl shadow-ambient border-2 border-transparent hover:border-primary-light active:scale-95 transition-all focus:border-primary/30 group">
<div class="w-10 h-10 rounded-full bg-surface-variant/50 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Other</span>
</button>
</div>
</div>
<!-- Hidden custom bank input, revealed if 'Other' is clicked (simulated logic) -->
<div class="relative flex items-center hidden" id="custom-bank-input">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/60">business</span>
<input class="w-full bg-primary-light border-none rounded-xl py-4 pl-12 pr-4 font-body-md text-body-md text-primary placeholder:text-primary/40 focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="Enter bank name" type="text"/>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent z-50">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl py-4 shadow-elevated active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">check</span>
            Save Account
        </button>
</div>
<script>
        // Simple input formatting for the balance field to feel 'calm'
        const balanceInput = document.getElementById('balance-input');
        balanceInput.addEventListener('input', function(e) {
            let val = e.target.value.replace(/[^\d.]/g, '');
            // Basic logic to allow typing normally, a robust app would use a proper currency formatter
            if(val !== '') {
                e.target.value = val;
            }
        });
    </script>
</body></html>
