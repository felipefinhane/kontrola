<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-light selection:text-primary">
<!-- Top App Bar (Simplified for transactional screen) -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-container-margin py-stack-md z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- No trailing icons on transactional screen -->
<div class="w-10 h-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-margin max-w-md mx-auto w-full pt-8">
<!-- Header Section -->
<div class="mb-10 text-center md:text-left">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-light text-primary mb-6">
<span class="material-symbols-outlined text-3xl" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-3">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">No worries, it happens. Enter your email and we'll send you a link to reset it.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
</div>
<input class="kontrola-input w-full bg-primary-light border-transparent rounded-2xl py-4 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/60 transition-all" id="email" name="email" placeholder="hello@example.com" required="" type="email"/>
</div>
</div>
<!-- CTA Area (Thumb Zone on Mobile) -->
<div class="mt-8 flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-2xl hover:bg-primary-container active:scale-[0.98] transition-all shadow-md" type="submit">
                    Send Reset Link
                </button>
<a class="w-full text-center font-label-md text-label-md text-primary hover:text-primary-container py-3 rounded-2xl hover:bg-surface-container-low transition-colors" href="#">
                    Back to Log In
                </a>
</div>
</form>
</main>
<!-- Navigation Shell Suppressed (Transactional Page) -->
