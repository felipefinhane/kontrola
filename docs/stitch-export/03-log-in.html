        .material-symbols-outlined {

        }

        .ambient-shadow-sm {
            box-shadow: 0 4px 20px rgba(2, 36, 72, 0.06);
        }
        .ambient-shadow-md {
            box-shadow: 0 4px 12px rgba(2, 36, 72, 0.12);

<body class="bg-background h-full flex flex-col items-center justify-center font-body-md text-on-surface antialiased px-container-margin">
<!--
        Navigation Suppressed: This is a transactional (login) screen.
        The TopAppBar and BottomNavBar are deliberately omitted.
    -->
<main class="w-full max-w-md mx-auto flex flex-col gap-stack-xl relative z-10">
<!-- Brand / Header -->
<header class="text-center flex flex-col gap-stack-sm items-center">
<!-- Subtle logo mark -->
<div class="w-16 h-16 rounded-[16px] bg-primary flex items-center justify-center ambient-shadow-md mb-2">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="water_drop" data-weight="fill">water_drop</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Kontrola</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Calm Control.</p>
</header>
<!-- Login Card -->
<section class="bg-surface-container-lowest rounded-[16px] p-stack-lg ambient-shadow-sm flex flex-col gap-stack-lg w-full">
<form action="#" class="flex flex-col gap-stack-md w-full" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm w-full">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="w-full bg-primary-light border-none rounded-[12px] py-3 pl-10 pr-4 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline/60" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm w-full">
<div class="flex justify-between items-center w-full">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="w-full bg-primary-light border-none rounded-[12px] py-3 pl-10 pr-4 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline/60" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Primary CTA -->
<button class="mt-stack-sm w-full bg-primary text-on-primary rounded-[16px] py-3.5 px-6 font-label-md text-label-md flex justify-center items-center gap-2 ambient-shadow-md hover:bg-primary-container active:scale-95 transition-all duration-200" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2 w-full">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-outline">or</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Sign Up Link -->
<div class="text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account?
                    <a class="font-label-md text-label-md text-primary font-semibold hover:underline" href="#">Sign Up</a>
</p>
</div>
</section>
</main>
<!-- Decorative background element for calm atmosphere -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden opacity-30">
<div class="absolute -top-[20%] -right-[10%] w-[70vw] h-[70vw] rounded-full bg-gradient-to-br from-primary-fixed-dim/20 to-transparent blur-3xl"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-tr from-secondary-fixed-dim/20 to-transparent blur-3xl"></div>
</div>
