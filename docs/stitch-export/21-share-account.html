<style>
        body { background-color: theme('colors.background'); }
        /* Ambient Shadow Utilities */
        .shadow-ambient-card { box-shadow: 0px 4px 20px 0px rgba(2, 36, 72, 0.06); }
        .shadow-ambient-button { box-shadow: 0px 4px 12px 0px rgba(2, 36, 72, 0.12); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="antialiased min-h-screen relative pb-32 md:pb-container-margin">
<!-- Top Navigation (Task-focused: Back button instead of menu) -->
<header class="flex justify-between items-center px-container-margin py-stack-md w-full sticky top-0 bg-background z-10">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Share Account</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="px-container-margin pt-stack-md flex flex-col gap-stack-xl max-w-2xl mx-auto">
<!-- Context Card -->
<section>
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-ambient-card border-b-2 border-accent relative overflow-hidden">
<!-- Subtle background element to soften the card -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-light rounded-full -translate-y-1/2 translate-x-1/3 opacity-50 pointer-events-none"></div>
<div class="flex items-center gap-4 relative z-10">
<div class="w-12 h-12 rounded-full bg-primary-light flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Sharing access to</p>
<h2 class="font-headline-sm text-headline-sm text-primary mt-1">Main Checking - Itaú</h2>
</div>
</div>
</div>
</section>
<!-- Input Form -->
<section class="flex flex-col gap-stack-lg">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 ml-1" for="inviteEmail">Invite via Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-primary-light rounded-xl border-none pl-12 pr-4 py-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="inviteEmail" placeholder="colleague@example.com" type="email"/>
</div>
</div>
<!-- Contextual Note -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-on-surface-variant mt-0.5">info</span>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    Invitees will only be able to view and add transactions to this specific account. They will not see your overall balance or other accounts.
                </p>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent md:relative md:bg-none md:mt-stack-xl max-w-2xl mx-auto md:bottom-auto">
<button class="w-full bg-primary-container text-on-primary py-4 px-6 rounded-2xl font-headline-sm text-headline-sm shadow-ambient-button hover:bg-primary-container/90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
            Send Invite
        </button>
</div>
